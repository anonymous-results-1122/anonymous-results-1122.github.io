<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>View4D : Synchronized Multi-View Video Generation in the Open World</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1d21;
    --muted: #5c6670;
    --line: #e2e6ea;
    --accent: #1f6feb;
    --surface: #f6f8fa;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    padding: 0 20px 72px;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
  }

  .wrap { max-width: 1180px; margin: 0 auto; }

  header {
    padding: 52px 0 26px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 44px;
  }

  header h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 650;
    line-height: 1.35;
    letter-spacing: -0.015em;
  }

  section { margin-bottom: 60px; }
  section:last-of-type { margin-bottom: 0; }

  h2 {
    font-size: 21px;
    font-weight: 620;
    letter-spacing: -0.01em;
    margin: 0 0 6px;
    scroll-margin-top: 24px;
  }

  .sub {
    margin: 0 0 22px;
    color: var(--muted);
    font-size: 14.5px;
  }

  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
  }

  .tab {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--fg);
    font: inherit;
    font-size: 14.5px;
    font-weight: 500;
    padding: 8px 17px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background .13s, border-color .13s, color .13s;
  }

  .tab:hover { background: var(--surface); }

  .tab[aria-selected="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .tab:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .panel { display: none; }
  .panel.is-active { display: block; }

  figure {
    margin: 0;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    background: #000;
  }

  /* A 1:1 grid at full container width is taller than the viewport. */
  figure.narrow {
    max-width: 680px;
    margin-inline: auto;
  }

  video {
    display: block;
    width: 100%;
    height: auto;
    background: #000;
  }

  figcaption {
    padding: 11px 15px;
    background: var(--surface);
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 13.5px;
  }

  figcaption b {
    color: var(--fg);
    font-weight: 600;
  }

  .pair {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  @media (max-width: 860px) {
    .pair { grid-template-columns: 1fr; }
    header { padding-top: 36px; }
    header h1 { font-size: 22px; }
  }
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>View4D : Synchronized Multi-View Video Generation in the Open World</h1>
</header>

<section id="part2">
  <h2>Results of synchronized multi-view video generation</h2>
  <p class="sub">Each grid shows the input video together with eight generated viewpoints.</p>

  <div class="pair">
    <figure>
      <video src="../assets/view4d_grid_3x3_yaw_pos15.mp4" autoplay loop muted playsinline preload="metadata"></video>
    </figure>
    <figure>
      <video src="../assets/view4d_grid_3x3_yaw_neg15.mp4" autoplay loop muted playsinline preload="metadata"></video>
    </figure>
  </div>
</section>

</div>
</body>
</html>
